name: CI

# Gate every change to main on the plain-assert test suite + a byte-compile of the
# whole package. The tests need no network (Supabase/HTTP are mocked or use dummy env),
# so this runs in well under a minute.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install security scanners
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip install bandit==1.9.4
      - name: Audit Python dependency vulnerabilities
        run: |
          python -m pip_audit -r requirements.txt --progress-spinner off
      - name: Static security analysis
        run: |
          python -m bandit -r . -x ./tests,./.git,./onepager/test_onepager.py,./test_client.py -ll -q

  test:
    runs-on: ubuntu-latest
    env:
      # The suites call os.environ.setdefault for these; set explicit dummies so a
      # runner with stray env can't change behaviour.
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-key
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # matches the Dockerfile (python:3.12-slim)
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest==9.1.1

      - name: Byte-compile the package
        run: python -m compileall -q .

      - name: Validate TrueFoundry gateway desired state
        run: python scripts/validate_truefoundry_gateway.py

      - name: Run pytest-style gateway security tests
        run: python -m pytest -q tests/test_gateway_trust.py tests/test_truefoundry_gateway.py

      - name: Run test suite
        run: |
          set -euo pipefail
          fail=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            if python "$t"; then echo "PASS $t"; else echo "FAIL $t"; fail=1; fi
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more test files failed"; exit 1
          fi
          echo "all test files passed"
