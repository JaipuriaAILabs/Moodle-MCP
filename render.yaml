# Render blueprint — kept in sync with the LIVE service (srv-da61ppjncjis73aer1hg,
# https://moodle-mcp-f6do.onrender.com). The deployed service runs the Dockerfile on the
# free plan; this file previously described a python-runtime/starter service that never
# matched production, so a re-deploy from blueprint would have built a different service.
services:
  - type: web
    name: jaipuria-moodle-mcp
    runtime: docker            # live service builds ./Dockerfile (python:3.12-slim)
    plan: standard             # production: no cold starts; supports horizontal scaling
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health   # was unset on the live service — enables zero-downtime deploys
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_DATA_KEY           # SELECT-only reporting_readonly JWT
        sync: false
      - key: SUPABASE_OAUTH_STORAGE_KEY  # CRUD only on mcp_oauth_kv
        sync: false
      - key: SUPABASE_AUDIT_KEY          # execute only record_mcp_tool_call
        sync: false
      - key: SUPABASE_ANON_KEY           # required when the DB key is a custom-role JWT
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_JWT_SIGNING_KEY
        sync: false
      # MUST be a STABLE, permanent value — the DCR client/token store is encrypted
      # with a key derived from it, so CHANGING it orphans every registered client
      # ("client ID not found", forcing every user to re-add the connector). To rotate
      # safely, set a COMMA-SEPARATED keyset "<new>,<previous>": values encrypt under
      # the first key and decrypt under any, so no one is logged out during the grace
      # window. Same rule for OAUTH_JWT_SIGNING_KEY (stable, else tokens die each deploy).
      - key: OAUTH_STORAGE_ENCRYPTION_KEY
        sync: false
      - key: OAUTH_REDIRECT_HOSTS
        sync: false
      - key: OAUTH_ALLOW_CROSS_CLIENT_PKCE
        value: "false"
      - key: MCP_SERVER_BASE_URL
        sync: false
      - key: OAUTH_ALLOWED_DOMAINS
        value: jaipuria.ac.in
      # ~500 faculty share campus egress IPs (NAT), so the PRE-AUTH per-IP flood
      # limit needs headroom; per-principal limits (90/min) still bound each user.
      - key: MCP_IP_RATE_LIMIT
        value: "1200"
      - key: MCP_RATE_LIMIT_MAX_KEYS
        value: "16384"
      - key: MCP_REDIS_URL
        sync: false
      # true: trust Render's X-Forwarded-For so per-user source IP is recorded
      # (and per-IP rate limiting keys on the real client, not Render's proxy).
      - key: MCP_TRUST_PROXY_HEADERS
        value: "true"
      - key: MCP_ALLOWED_HOSTS
        value: moodle-mcp.tryrehearsal.ai
      - key: MCP_AUDIT_HMAC_KEY
        sync: false
      - key: MCP_REQUIRE_AUDIT
        value: "true"
      # OpenTelemetry tracing → New Relic EU (account 8495484). Set the ingest/license
      # key to turn tracing on (per-tool spans → error rate, p95 latency, throughput);
      # unset = no telemetry. See monitoring/README.md.
      - key: NEW_RELIC_LICENSE_KEY
        sync: false
      - key: MCP_OTEL_ENDPOINT
        value: https://otlp.eu01.nr-data.net
      # Activity capture (AIA-1012). Each flag WIDENS mcp_audit.tool_calls.metadata
      # beyond the privacy-safe default. All "false" here = today's behaviour (only a
      # pseudonymised event is stored). Turn on to record real identity / full tool
      # arguments / result payloads / source IP — student PII + who-viewed-whom, so
      # gate them behind a decided retention + privacy-notice posture, and never
      # mirror the raw values to New Relic. Size caps bound each row.
      # MEASURED activity recording ("to an extent", data-owner decision 2026-09-21):
      # capture WHO did WHAT — real identity + the call arguments (which student was
      # queried) + source IP + connection events — but NOT the returned result payloads
      # (RESULTS=false), so the audit ledger does not duplicate every student's marks.
      # That gives full accountability/traceability (AIA-1210) with far less PII.
      # REQUIRES, to persist: the mcp_audit backend applied (sql/2026-09-18_...) AND
      # SUPABASE_AUDIT_KEY (mcp_audit_writer JWT) + MCP_AUDIT_HMAC_KEY set below.
      # Keep raw PII in this locked schema only — never mirror it to New Relic.
      - key: MCP_CAPTURE_IDENTITY
        value: "true"
      - key: MCP_CAPTURE_ARGUMENTS
        value: "true"
      - key: MCP_CAPTURE_RESULTS
        value: "false"          # measured level — don't duplicate returned marks into the log
      - key: MCP_CAPTURE_CLIENT_IP
        value: "true"
      - key: MCP_CAPTURE_ARGS_MAX_BYTES
        value: "32768"
      - key: MCP_CAPTURE_RESULT_MAX_BYTES
        value: "262144"
      # Zero-trust PII boundary: FastMCP ToolResult structured/text content is
      # pseudonymised before it leaves the server or enters the audit result field.
      # This dedicated key must be stable across deploys; changing it rotates S_* refs.
      - key: MCP_PII_HMAC_KEY
        sync: false
      - key: MCP_PII_REDACTION_MODE
        value: "enforce"
      # The Supabase mcp_faculty registry is the authoritative whitelist.
      # Unlisted identities are denied and campus_admin grants are single-campus.
      - key: MCP_RBAC_MODE
        value: "enforce"
      - key: MCP_CAMPUSES
        value: noida,lucknow,jaipur,indore
      - key: MCP_STUDENT_SELF_ACCESS
        # Student identities resolve from the roster and are restricted to the
        # reviewed self-only tool allowlist + their own enrolment IDs. Any lookup
        # failure denies; it never falls through to educator/campus access.
        value: "true"
      - key: MCP_SELF_SERVICE_ACCESS
        value: "false"
      # Optional identity-free access-request relay. Configure both values together;
      # leaving both blank keeps notification disabled and the DB queue authoritative.
      - key: MCP_ACCESS_REQUEST_WEBHOOK_URL
        sync: false
      - key: MCP_ACCESS_REQUEST_WEBHOOK_SECRET
        sync: false
      # ENFORCE should keep the unlisted-account default at deny/pending.
      - key: OAUTH_DEFAULT_CAMPUSES
        value: none
      - key: MCP_FACULTY
        sync: false
      # On-demand report generation (create_report tool); leave unset to disable.
      - key: AGENT_API_BASE
        sync: false
      # Dedicated HMAC credential restricted to /report-jobs; never reuse ADMIN_PASS.
      - key: AGENT_SHARED_SECRET
        sync: false
      - key: AGENT_REPORT_QUEUE
        value: "true"
      - key: REPORT_PUBLIC_BASE_URL
        value: https://reports.tryrehearsal.ai
      # MCP_TOKENS / MCP_ADMIN_TOKEN are intentionally absent: in OAuth mode FastMCP
      # rejects static bearers before any handler runs, so they are dead secrets in env.
