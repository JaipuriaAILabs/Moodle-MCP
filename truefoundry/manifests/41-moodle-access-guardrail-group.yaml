{
  "type": "provider-account/guardrail-config-group",
  "name": "moodle-access",
  "integrations": [
    {
      "name": "cedar-rbac",
      "description": "Default-deny tool authorization for the Jaipuria Moodle MCP. Source-side RBAC remains authoritative for student and campus row scope.",
      "type": "integration/guardrail-config/cedar",
      "operation": "validate",
      "enforcing_strategy": "enforce",
      "config": {
        "policy": "permit (\n    principal,\n    action == Action::\"execute_tool\",\n    resource == MCPServer::\"jaipuria-moodle-student\"\n) when {\n    principal is User &&\n    principal.teamNames.contains(\"everyone\")\n};\n\npermit (\n    principal,\n    action == Action::\"execute_tool\",\n    resource == MCPServer::\"jaipuria-moodle-staff\"\n) when {\n    principal is User &&\n    [\n        \"shreevats@jaipuria.ac.in\",\n        \"shiva.kakkar@jaipuria.ac.in\",\n        \"prabhat.pankaj@jaipuria.ac.in\",\n        \"shailaja.sharma@jaipuria.ac.in\",\n        \"amit.attry@jaipuria.ac.in\",\n        \"sauresh.mehrotra@jaipuria.ac.in\",\n        \"kanchan.rana@jaipuria.ac.in\",\n        \"sandip.das@jaipuria.ac.in\",\n        \"rahul.singh@jaipuria.ac.in\",\n        \"sushma.vishnani@jaipuria.ac.in\",\n        \"daneshwar.sharma@jaipuria.ac.in\",\n        \"deepankar.chakrabarti@jaipuria.ac.in\"\n    ].contains(principal.email)\n};\n\npermit (\n    principal,\n    action == Action::\"execute_tool\",\n    resource == MCPServer::\"jaipuria-moodle-prod\"\n) when {\n    principal is User &&\n    principal.teamNames.contains(\"everyone\") &&\n    [\n        \"whoami\",\n        \"get_student\",\n        \"student_marks\",\n        \"student_attendance\",\n        \"student_trajectory\",\n        \"student_360\",\n        \"get_student_report\",\n        \"create_report\",\n        \"get_report_job\",\n        \"resolve_identities\"\n    ].contains(context.tool_name)\n};\n\npermit (\n    principal,\n    action == Action::\"execute_tool\",\n    resource == MCPServer::\"jaipuria-moodle-prod\"\n) when {\n    principal is User &&\n    [\n        \"shreevats@jaipuria.ac.in\",\n        \"shiva.kakkar@jaipuria.ac.in\",\n        \"prabhat.pankaj@jaipuria.ac.in\",\n        \"shailaja.sharma@jaipuria.ac.in\",\n        \"amit.attry@jaipuria.ac.in\",\n        \"sauresh.mehrotra@jaipuria.ac.in\",\n        \"kanchan.rana@jaipuria.ac.in\",\n        \"sandip.das@jaipuria.ac.in\",\n        \"rahul.singh@jaipuria.ac.in\",\n        \"sushma.vishnani@jaipuria.ac.in\",\n        \"daneshwar.sharma@jaipuria.ac.in\",\n        \"deepankar.chakrabarti@jaipuria.ac.in\"\n    ].contains(principal.email) &&\n    [\n        \"whoami\",\n        \"list_students\",\n        \"get_student\",\n        \"student_marks\",\n        \"student_attendance\",\n        \"list_subjects\",\n        \"subject_performance\",\n        \"section_compare\",\n        \"assessment_breakdown\",\n        \"subject_difficulty\",\n        \"campus_performance_report\",\n        \"declining_students\",\n        \"student_trajectory\",\n        \"student_360\",\n        \"cohort_pulse\",\n        \"watchlist\",\n        \"marks_overview\",\n        \"attendance_overview\",\n        \"top_performers\",\n        \"cohort_compare\",\n        \"at_risk_students\",\n        \"attendance_watch\",\n        \"zero_alerts\",\n        \"get_student_report\",\n        \"report_data_availability\",\n        \"create_report\",\n        \"get_report_job\",\n        \"resolve_identities\"\n    ].contains(context.tool_name)\n};"
      }
    }
  ]
}
